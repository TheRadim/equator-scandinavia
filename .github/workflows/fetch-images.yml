name: Fetch product images
# Downloads official Equator photographs listed in website/src/data/gallery-candidates.json,
# generates WebP variants and commits new files to the same branch.
on:
  push:
    branches: [codex/website-prototype]
    paths: ['website/src/data/gallery-candidates.json', 'website/scripts/fetch-images.mjs', '.github/workflows/fetch-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node scripts/fetch-images.mjs
      - run: npm run images
      - name: Commit new images
        run: |
          git add public/images
          if git diff --cached --quiet; then echo "No new images"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: fetch official product photographs"
          git push
