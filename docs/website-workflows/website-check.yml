name: Website checks
on:
  push:
    paths: ['website/**', 'worker/**', '.github/workflows/website-check.yml']
  pull_request:
    paths: ['website/**', 'worker/**', '.github/workflows/website-check.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Inquiry worker tests
        working-directory: worker
        run: npm test
