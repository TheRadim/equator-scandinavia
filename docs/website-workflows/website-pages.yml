name: Publish approved website prototype
on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'Type PUBLISH to make this prototype publicly accessible'
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirm_publication == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: website
        env:
          # Repository → Settings → Secrets and variables → Actions → Variables.
          # All optional; empty values keep demo mode and noindex.
          PUBLIC_INQUIRY_ENDPOINT: ${{ vars.PUBLIC_INQUIRY_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_REPRESENTATIVE_EMAIL: ${{ vars.PUBLIC_REPRESENTATIVE_EMAIL }}
          PUBLIC_ALLOW_INDEXING: ${{ vars.PUBLIC_ALLOW_INDEXING }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
